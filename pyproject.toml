[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "opensearch-guardian"
version = "0.1.0"
description = "Open-source desktop operations console for OpenSearch"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "opensearch-py>=2.0",
    "httpx>=0.27",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "aiohttp>=3.9",
    "responses>=0.24",
    "docker>=7.0",
]
cli = [
    "typer>=0.12",
    "rich>=13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian*", "apps*"]

# ─── pytest ─────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "--cov=guardian",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
]
markers = [
    "unit:            Unit tests (no external deps)",
    "integration:     Integration tests (requires OpenSearch fixture)",
    "e2e:             End-to-end tests (requires full fixture stack)",
    "slow:            Slow tests (>5s per test)",
    "docker:          Requires Docker daemon",
    "fixtures:        Tests that start/stop Docker fixtures",
    "safety:          Safety engine tests",
    "models:          Model validation tests",
    "connections:     Connection manager tests",
    "rules:           Cluster Doctor rule tests",
    "diagnosis:       Diagnosis engine tests",
    "keychain:        Keychain/credential tests",
    "audit:           Audit log tests",
    "mock_os:         Tests that mock OS-level calls",
]
asyncio_mode = "auto"

# ─── coverage ────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["guardian"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/apps/*",
    "*/conftest.py",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
