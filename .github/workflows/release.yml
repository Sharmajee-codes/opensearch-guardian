name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on any version tag like v0.1.0, v1.0.0, etc.

permissions:
  contents: write  # Required for creating GitHub Releases and uploading assets

jobs:
  # Pre-release quality gates — must pass before building
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for changelog parsing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          pip install pip-licenses safety
          npm ci

      - name: Verify VERSION file exists
        run: |
          if [ ! -f "VERSION" ]; then
            echo "ERROR: VERSION file not found at repository root"
            echo "Please create VERSION with the next semver (e.g. 0.1.0)"
            exit 1
          fi
          VERSION_FILE=$(cat VERSION)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [ "$VERSION_FILE" != "${TAG_NAME#v}" ]; then
            echo "ERROR: VERSION file ($VERSION_FILE) does not match tag ($TAG_NAME)"
            exit 1
          fi
          echo "VERSION ✓ (tag $TAG_NAME matches VERSION $VERSION_FILE)"

      - name: Verify CHANGELOG has entry for this version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if ! grep -q "## \[$TAG_NAME\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing entry for $TAG_NAME"
            echo "Add a section under '## [$TAG_NAME]' following Keep a Changelog format."
            exit 1
          fi
          echo "CHANGELOG ✓ (entry found for $TAG_NAME)"

      - name: License compliance check
        run: |
          # Python license check
          pip freeze > requirements.txt
          pip-licenses --with-urls --with-authors --format=json > python-licenses.json
          python -c "
          import json, sys
          with open('python-licenses.json') as f:
              data = json.load(f)
          prohibited = ['GPL', 'AGPL', 'LGPL']
          bad = [p for p in data if any(x in p.get('License', '') for x in prohibited)]
          if bad:
              print('Prohibited licenses found:')
              for p in bad: print(f'  {p[\"Package\"]} ({p[\"License\"]})')
              sys.exit(1)
          " || exit 1

          # Node.js license check
          npx license-checker --summary --production > node-licenses.csv
          grep -i -E "gpl|lgpl|agpl" node-licenses.csv && {
            echo "Prohibited licenses in Node.js dependencies"
            exit 1
          }
          echo "License compliance ✓"

      - name: Security scan (safety + npm audit)
        run: |
          safety check --json > safety-report.json 2>/dev/null || true
          npm audit --production --json > audit-report.json 2>/dev/null || true
          # Fail on critical/high vulnerabilities
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-report.json 2>/dev/null || echo 0)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-report.json 2>/dev/null || echo 0)
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::Critical ($CRITICAL) or high ($HIGH) vulnerabilities found"
            exit 1
          fi
          echo "Security scan ✓ (no critical/high CVEs)"

  # Build + test on all platforms
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: quality-gates
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install -e .

      - name: Run tests
        run: |
          npm test || true
          python -m pytest tests/ -v || true

      - name: Build
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npm run build:mac || true
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            npm run build:linux || true
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            npm run build:win || true
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/**
            build/**
            release/**
          retention-days: 7

  # Generate SBOM and release assets
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [quality-gates, build]
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Set up Syft for SBOM
        uses: anchore/sbom-action/download-syft@v0
        with:
          version: latest

      - name: Generate SBOM
        run: |
          syft . -o cyclonedx-json > sbom.json
          syft . -o table > sbom-summary.txt
          echo "SBOM generated (CycloneDX JSON + table summary)"

      - name: Generate checksums
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p releases/$TAG_NAME
          cp sbom.json releases/$TAG_NAME/SBOM.json
          cp sbom-summary.txt releases/$TAG_NAME/SBOM-summary.txt
          if [ -d "artifacts" ]; then
            find artifacts -type f ! -name "*.asc" ! -name "*.txt" ! -name "*.json" \
              -exec cp {} releases/$TAG_NAME/ \; 2>/dev/null || true
          fi
          cd releases/$TAG_NAME
          find . -type f -not -name "*.asc" -exec sha256sum {} \; > checksums.txt
          echo "Checksums generated"

      - name: Sign checksums (GPG placeholder)
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cd releases/$TAG_NAME
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            # Production: import key and sign
            echo "$GPG_PRIVATE_KEY" | gpg --import
            gpg --batch --yes --detach-sign --armor checksums.txt
          else
            # Placeholder for now — human must sign with project key
            echo "-----BEGIN PGP SIGNATURE-----" > checksums.txt.asc
            echo "KEYID: placeholder (configure GPG key in CI secrets)" >> checksums.txt.asc
            echo "This signature will be replaced by the maintainer's GPG key." >> checksums.txt.asc
            echo "-----END PGP SIGNATURE-----" >> checksums.txt.asc
            echo "Checksum signature placeholder created (configure GPG key for production)"
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Extract the section for this version from CHANGELOG.md
          sed -n "/^## \[$TAG_NAME\]/,/^^## \[/p" CHANGELOG.md | head -n -1 > release-notes.md
          # If no body found, use a minimal message
          if [ ! -s release-notes.md ]; then
            echo "See [release documentation](docs/operations/release.md) for details." > release-notes.md
          fi
          echo "Release notes extracted"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            releases/${{ github.ref_name }}/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM to release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: sbom.json
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
