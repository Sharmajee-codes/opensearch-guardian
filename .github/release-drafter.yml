name-template: 'OpenSearch Guardian v$VERSION'
tag-template: 'v$VERSION'
categories:
  - title: 'New Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: 'Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: 'Infrastructure'
    labels:
      - 'ci'
      - 'infrastructure'
  - title: 'Dependencies'
    labels:
      - 'dependencies'
exclude-labels:
  - 'skip-changelog'
  - 'wontfix'
  - 'duplicate'
  - 'question'
  - 'invalid'
  - 'release-drafter-ignore'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$VERSION